# ── Cloudflare Workers (adaptador OpenNext) ──────────────────
# Docs: https://developers.cloudflare.com/workers/framework-guides/web-apps/opennext/
name = "esper-site"
main = ".open-next/worker.js"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
NEXT_PUBLIC_SITE_URL = "https://www.ricardoesper.com.br"
NEXT_PUBLIC_GA_ID = ""
NEXT_PUBLIC_TURNSTILE_SITE_KEY = ""
NEXT_PUBLIC_CF_ANALYTICS_TOKEN = ""
# Segredos (TURNSTILE_SECRET_KEY, JWT_SECRET, ANTHROPIC_API_KEY…) entram por
# `wrangler secret put`, nunca aqui.

# Cache incremental do Next (ISR) — usado por open-next.config.ts
[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "be713a5886ce4375af6513a548b7381c"

# Banco dos posts. Já populado: 35 posts publicados.
# Como binding, dispensa CLOUDFLARE_API_TOKEN em runtime.
[[d1_databases]]
binding = "DB"
database_name = "esper"
database_id = "a7d71d17-0737-4996-8c66-36b945ea9a1f"

# Imagens do blog
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "esper-site-images"
