# ── Cloudflare Workers configuration (OpenNext adapter) ──────
# Docs: https://opennext.js.org/cloudflare
name = "esper-site"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# OpenNext assets
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
NEXT_PUBLIC_SITE_URL = "https://esper.ws"
NEXT_PUBLIC_GA_ID = ""

# Cloudflare KV for ISR/caching
# Uncomment and set IDs after creating resources in CF dashboard:
# [[kv_namespaces]]
# binding = "NEXT_CACHE_WORKERS_KV"
# id = "<your-kv-namespace-id>"

# Cloudflare D1 (SQLite) – uncomment when migrating from Supabase
# [[d1_databases]]
# binding = "DB"
# database_name = "esper-site-db"
# database_id = "<your-d1-database-id>"

# Cloudflare R2 for image storage – uncomment when ready
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "esper-site-images"
